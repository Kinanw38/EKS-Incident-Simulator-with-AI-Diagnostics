apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
    sim-incident: crashloop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-api
        image: busybox
        command: ['sh', '-c', 'if [ -z "$DB_PASSWORD" ]; then echo "Fatal: DB_PASSWORD env var missing!"; exit 1; fi; sleep 3600']
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: missing-db-secret
              key: password