apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-worker
  labels:
    app.kubernetes.io/part-of: incident-simulator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: report-worker
  template:
    metadata:
      labels:
        app: report-worker
    spec:
      containers:
      - name: worker
        image: polinux/stress
        command: ["stress"]
        args: ["--cpu", "1"]
        resources:
          limits:
            cpu: "200m"
            memory: "64Mi"
          requests:
            cpu: "100m"
            memory: "32Mi"
