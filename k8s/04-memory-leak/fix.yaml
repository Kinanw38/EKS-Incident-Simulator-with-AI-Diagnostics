apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-service
  labels:
    app.kubernetes.io/part-of: incident-simulator
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cache-service
  template:
    metadata:
      labels:
        app: cache-service
    spec:
      containers:
      - name: leaky-cache
        image: polinux/stress
        command: ["stress"]
        args: ["--vm", "1", "--vm-bytes", "200M", "--vm-keep"]
        resources:
          limits:
            memory: "512Mi"
          requests:
            memory: "256Mi"
