<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>System architecture: hosted app talking to a real or mocked Amazon EKS cluster</title>
<desc>A hosted web app (dashboard and control API) optionally talks to a live Amazon EKS cluster running injected fault scenarios; in Demo Mode it uses mock data instead.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7c7c74" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="300" rx="16" fill="#0b0b0d"/>

<!-- Container 1: Hosted app -->
<rect x="40" y="30" width="290" height="240" rx="20" fill="#04342c" stroke="#0f6e56" stroke-width="0.5"/>
<text x="185" y="60" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="500" fill="#9fe1cb">Hosted app</text>
<text x="185" y="78" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#5dcaa5">Free web host</text>

<rect x="65" y="98" width="240" height="56" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="0.5"/>
<text x="185" y="120" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="500" fill="#f4f4f5">Dashboard UI</text>
<text x="185" y="138" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#a1a1aa">React + Vite</text>

<line x1="185" y1="154" x2="185" y2="166" stroke="#7c7c74" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="65" y="168" width="240" height="56" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="0.5"/>
<text x="185" y="190" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="500" fill="#f4f4f5">Control API</text>
<text x="185" y="208" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#a1a1aa">FastAPI + RCA engine</text>

<!-- Connector between the two containers -->
<line x1="330" y1="150" x2="349" y2="150" stroke="#7c7c74" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Container 2: AWS EKS -->
<rect x="350" y="30" width="290" height="240" rx="20" fill="#4a1b0c" stroke="#993c1d" stroke-width="0.5"/>
<text x="495" y="60" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="500" fill="#f0997b">AWS EKS cluster</text>
<text x="495" y="78" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#f5c4b3">Live Kubernetes cluster</text>

<rect x="375" y="130" width="240" height="56" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="0.5"/>
<text x="495" y="152" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="500" fill="#f4f4f5">Injected pods</text>
<text x="495" y="170" text-anchor="middle" font-family="-apple-system,Segoe UI,sans-serif" font-size="12" fill="#a1a1aa">3 fault scenarios</text>

</svg>
